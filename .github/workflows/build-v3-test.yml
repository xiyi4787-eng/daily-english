name: Build Daily English 3.1 test APK
on:
  push:
    branches: [codex/daily-english-v3-test]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile practice test APK
        run: |
          unzip -q daily-english-v3-source.zip -d v3-source
          printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/daily-english-31.patch"
          patch --batch --directory=v3-source -p1 < "$RUNNER_TEMP/daily-english-31.patch"
          gradle -p v3-source --no-daemon assembleDebug
      - name: Verify APK
        run: |
          app=v3-source/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$app"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$app" | grep -F "package: name='com.dailyenglish.app.test31' versionCode='4' versionName='3.1'"
      - uses: actions/upload-artifact@v4
        with:
          name: Daily-English-3.1-Test
          path: v3-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
